services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moodtracker_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    networks:
      - moodtracker_network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ngrok:
        condition: service_started

  ngrok:
    image: ngrok/ngrok:latest
    container_name: moodtracker_ngrok
    command: http --domain=${NGROK_URL} app:8000
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml
    networks:
      - moodtracker_network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: moodtracker_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moodtracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-moodtracker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - moodtracker_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moodtracker}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  moodtracker_network:
    driver: bridge

volumes:
  postgres_data:
