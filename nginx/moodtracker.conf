# Nginx reverse-proxy config for moodtracker bot
# Deploy to: /etc/nginx/sites-available/moodtracker.conf
# Symlink to: /etc/nginx/sites-enabled/moodtracker.conf
#
# Setup:
#   sudo ln -s /etc/nginx/sites-available/moodtracker.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name skaters.top;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name skaters.top;

    # SSL certs (install via certbot: sudo certbot --nginx -d skaters.top)
    ssl_certificate /etc/letsencrypt/live/skaters.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skaters.top/privkey.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        # Proxy to FastAPI running in Docker on port 8000
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:8000/;
    }
}
