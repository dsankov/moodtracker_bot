# Production docker-compose (no ngrok, nginx handles SSL on the host)
# Usage: docker compose -f docker-compose.prod.yml up -d
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moodtracker_app
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: moodtracker_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moodtracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-moodtracker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moodtracker}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
