# Production docker-compose (no ngrok, nginx handles SSL on the host)
# Usage: docker compose -f docker-compose.prod.yml up -d
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moodtracker_app
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
