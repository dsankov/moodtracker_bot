[project]
name = "moodtracker-bot"
version = "0.1.0"
description = "Helps you track your mood"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "aiogram>=3.23.0",
    "aiogram_dialog>=2.4.0",
    "sqlalchemy>=2.0.49",
    "pydantic>=2.12.5",
    "pydantic_settings>=2.12.0",
    "loguru>=0.7.3",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "fastapi>=0.124.2",
    "uvicorn>=0.38.0",
    "httpx>=0.28.1",
]

[dependency-groups]
lint = ["ruff>=0.9.9"]
dev = ["icecream>=2.1.4"]