[project]
name = "moodtracker-bot"
version = "0.1.0"
description = "Helps you track your mood"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "aiogram==3.17.0",
    "aiogram_dialog==2.3.1",
    "sqlalchemy==2.0.38",
    "pydantic==2.10.6",
    "pydantic_settings==2.7.1",
    "loguru==0.7.3",
    "aiosqlite==0.21.0",
    "alembic==1.14.1",
    "fastapi==0.115.8",
    "uvicorn==0.34.0",
    # "httpx==0.28.1",
    # "apscheduler==3.11.0",
    # "pytz==2024.2",
    "httpx>=0.28.1",
]

[dependency-groups]
lint = [
    "ruff>=0.9.9",
]
dev = [
    "icecream>=2.1.4",
]

